# Comprobación completa en cada pull request y en cada push a main (CA-6).
# En push a main, si la comprobación pasa, se despliega en Render (job `deploy`).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: just check + integración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar just
        uses: extractions/setup-just@v3

      - name: Instalar dependencias (versiones exactas de uv.lock)
        run: uv sync --locked

      - name: Lint, tipos, arquitectura y pruebas unitarias
        run: just check

      - name: Pruebas de integración (PostgreSQL real con Testcontainers)
        run: uv run pytest -m integration

  # Despliegue continuo: solo en push a main y solo si `check` pasó.
  # Render no ve el repositorio (es público, sin la app de GitHub), así que se le avisa
  # con su deploy hook. El hook solo encola el despliegue: confirmar en Render → Events.
  deploy:
    name: Desplegar en Render
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Llamar al deploy hook de Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL"
