# Comprobación completa en cada pull request y en cada push a main (CA-6).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: just check + integración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar just
        uses: extractions/setup-just@v3

      - name: Instalar dependencias (versiones exactas de uv.lock)
        run: uv sync --locked

      - name: Lint, tipos, arquitectura y pruebas unitarias
        run: just check

      - name: Pruebas de integración (PostgreSQL real con Testcontainers)
        run: uv run pytest -m integration
